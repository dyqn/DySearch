<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="iframe_pageTitle">多元搜索</title>
    <link rel="stylesheet" href="iframe.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="cards-panel">
        <div id="iframes-container" class="iframes-container" data-columns="1"></div>
      </section>

      <aside id="siteNavPanel" class="site-nav-panel" hidden>
        <div class="site-nav-header" data-i18n="iframe_siteNavTitle">AI 模型</div>
        <div id="siteNavList" class="site-nav-list"></div>
      </aside>

      <aside id="historyPanel" class="history-panel">
        <div class="history-panel-header">
          <h3 data-i18n="iframe_historyTitle">搜索记录</h3>
          <div class="history-header-actions">
            <button id="clearHistoryBtn" class="history-clear-btn" type="button" data-i18n="iframe_historyClear">清空</button>
            <button id="closeHistoryPanelBtn" class="history-close-btn" type="button" data-i18n-attr="aria-label:iframe_close"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div id="historyFilterBar" class="history-filter-bar" role="tablist" aria-label="搜索记录筛选">
          <button id="historyFilterAllBtn" class="history-filter-btn is-active" type="button" role="tab" aria-selected="true" data-history-filter="all" data-i18n="iframe_historyFilterAll">全部</button>
          <button id="historyFilterTodayBtn" class="history-filter-btn" type="button" role="tab" aria-selected="false" data-history-filter="today" data-i18n="iframe_historyFilterToday">今天</button>
          <button id="historyFilterYesterdayBtn" class="history-filter-btn" type="button" role="tab" aria-selected="false" data-history-filter="yesterday" data-i18n="iframe_historyFilterYesterday">昨天</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </aside>

      <section class="bottom-composer">
        <span id="globalStatus" class="global-status visually-hidden" data-i18n="iframe_loadingStatus">正在加载站点配置...</span>

        <div id="cardNavRow" class="card-nav-row">
          <div id="cardNavStrip" class="card-nav-strip"></div>
          <div class="add-site-menu-wrap">
            <button id="addSiteBtn" class="card-nav-add-btn composer-tooltip-btn" type="button" data-tooltip="添加卡片" data-i18n-attr="aria-label:iframe_addSiteAria;data-tooltip:iframe_addSiteTooltip" aria-expanded="false">+</button>
            <div id="addSitePopover" class="add-site-popover" hidden>
              <button id="closeAddSitePopoverBtn" class="add-site-close-btn" type="button" data-i18n-attr="aria-label:iframe_close">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
              <div id="addSiteTabs" class="add-site-tabs"></div>
              <div id="addSiteList" class="add-site-list"></div>
            </div>
          </div>
        </div>

        <div id="hScrollStrip" class="h-scroll-strip" hidden>
          <div id="hScrollThumb" class="h-scroll-thumb"></div>
        </div>

        <div class="bottom-composer-row">
        <div class="bottom-composer-bar">
          <div class="composer-input-shell">
            <div class="composer-input-row">
              <div class="composer-collapsed-actions" data-i18n-attr="aria-label:iframe_quickActionsAria" aria-label="快捷功能">
                <button id="quickExportBtn" class="composer-collapsed-action composer-tooltip-btn" type="button" data-tooltip="导出文档" data-i18n-attr="aria-label:iframe_exportDoc;data-tooltip:iframe_exportDoc"></button>
                <button id="quickHistoryBtn" class="composer-collapsed-action composer-tooltip-btn" type="button" data-tooltip="历史记录" data-i18n-attr="aria-label:iframe_history;data-tooltip:iframe_history"></button>
                <button id="quickAiSummaryBtn" class="composer-collapsed-action composer-tooltip-btn" type="button" data-tooltip="AI总结" data-i18n-attr="aria-label:iframe_aiSummaryTooltip;data-tooltip:iframe_aiSummaryTooltip"></button>
                <button id="quickLayoutBtn" class="composer-collapsed-action composer-tooltip-btn" type="button" data-tooltip="布局调整" data-i18n-attr="aria-label:iframe_layoutAdjust;data-tooltip:iframe_layoutAdjust"></button>
              </div>
              <textarea
                id="queryInput"
                class="bottom-query-input"
                placeholder="输入要搜索的问题"
                data-i18n-attr="placeholder:iframe_queryPlaceholder"
                rows="1"
              ></textarea>
            </div>

            <div class="composer-toolbar-row">
              <div class="left-tools-menu-wrap">
                <button id="leftToolsToggleBtn" class="composer-tool-btn composer-tool-icon-btn left-tools-toggle-btn" type="button" data-i18n-attr="aria-label:iframe_toolsAria" aria-expanded="false">
                  <svg viewBox="4.2 4.2 15.6 15.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </button>
                <div id="leftToolsPanel" class="left-tools-panel" hidden>
                  <button id="exportBtn" class="left-tools-item" type="button" data-i18n-attr="aria-label:iframe_exportDoc">
                    <span class="left-tools-item-icon">
                      <svg viewBox="0 0 1024 1024" aria-hidden="true">
                        <path d="M750.952139 1023.999132H195.742046A156.152839 156.152839 0 0 1 39.589207 859.171136V173.833678A173.503154 173.503154 0 0 1 74.289838 52.38147 182.178312 182.178312 0 0 1 213.092361 0.330524h485.808831l34.700631 17.350315 164.827996 190.853469a43.375789 43.375789 0 0 1 17.350316 34.700631v52.050946a52.050946 52.050946 0 0 1-43.375789 43.375789 43.375789 43.375789 0 0 1-43.375788-43.375789V260.585255L681.550877 87.082101H213.092361a86.751577 86.751577 0 0 0-69.401262 26.025473A104.101892 104.101892 0 0 0 126.340784 173.833678v685.337458c0 78.076419 60.726104 78.076419 69.401262 78.076419h555.210093a86.751577 86.751577 0 0 0 86.751577-69.401261 43.375789 43.375789 0 0 1 52.050946-26.025473c26.025473 0 34.700631 26.025473 34.700631 52.050946a190.853469 190.853469 0 0 1-173.503154 130.127365z" fill="currentColor"></path>
                        <path d="M933.13045 624.941878H438.646461a43.375789 43.375789 0 0 1-43.375788-43.375788 43.375789 43.375789 0 0 1 43.375788-43.375789h399.057255l-78.07642-78.076419c-8.675158-17.350315-8.675158-52.050946 8.675158-60.726104a43.375789 43.375789 0 0 1 60.726104 0l138.802523 156.152839a26.025473 26.025473 0 0 1 8.675158 43.375788 43.375789 43.375789 0 0 1-43.375789 26.025473z" fill="currentColor"></path>
                        <path d="M785.652769 763.744401h-34.70063a34.700631 34.700631 0 0 1 8.675157-69.401261L907.104977 555.540617a43.375789 43.375789 0 0 1 60.726104 60.726103L811.678242 755.069244z" fill="currentColor"></path>
                      </svg>
                    </span>
                    <span class="left-tools-item-label" data-i18n="iframe_exportDoc">导出文档</span>
                  </button>
                  <button id="historyToggleBtn" class="left-tools-item" type="button" data-i18n-attr="aria-label:iframe_historySearchAria">
                    <span class="left-tools-item-icon">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                          <path d="M12 8v4l2 2"></path>
                          <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
                        </g>
                      </svg>
                    </span>
                    <span class="left-tools-item-label" data-i18n="iframe_history">历史记录</span>
                  </button>
                  <button id="aiSummaryBtn" class="left-tools-item" type="button" data-i18n-attr="aria-label:iframe_aiSummaryTooltip">
                    <span class="left-tools-item-icon">
                      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M700.562286 387.657143q-47.469714-16.091429-63.780572-63.341714l-69.485714-201.728q-17.554286-51.273143-56.685714-51.2-39.058286 0.073143-56.466286 51.419428l-67.876571 200.045714q-16.091429 47.323429-63.488 63.414858L124.342857 453.778286q-51.2 17.481143-51.419428 56.539428-0.146286 39.131429 50.980571 56.905143l197.412571 68.754286q47.469714 16.530286 63.780572 64l68.900571 200.265143q17.627429 51.2 56.685715 51.2 39.058286-0.146286 56.393142-51.565715l67.291429-199.314285q15.945143-47.396571 63.268571-63.634286l201.654858-69.046857q51.346286-17.554286 51.2-56.612572 0-39.058286-51.419429-56.466285L700.562286 387.657143zM567.588571 348.16q27.940571 81.188571 109.421715 108.836571l161.133714 54.491429-164.352 56.32q-81.408 27.794286-108.909714 109.348571l-54.637715 162.084572-56.100571-163.035429Q426.276571 595.090286 345.234286 566.857143l-161.206857-56.100572 162.377142-55.222857q81.408-27.721143 109.129143-109.202285l55.369143-163.108572 56.758857 164.864z" fill="currentColor"/>

                      </svg>
                    </span>
                    <span class="left-tools-item-label" data-i18n="iframe_aiSummaryMenuLabel">AI总结下</span>
                  </button>
                  <div class="layout-menu-wrap">
                    <button id="layoutToggleBtn" class="left-tools-item" type="button" data-i18n-attr="aria-label:iframe_layoutSettings">
                      <span class="left-tools-item-icon">
                        <svg viewBox="0 0 1024 1024" stroke="currentColor" stroke-width="26" stroke-linejoin="round" aria-hidden="true">
                          <path d="M169 169v686h686V169H169z m640 46v146H215V215h594zM215 407h145.8v402H215V407z m191.8 402V407H809v402H406.8z" fill="currentColor"></path>
                        </svg>
                      </span>
                      <span class="left-tools-item-label" data-i18n="iframe_layoutAdjust">布局调整</span>
                    </button>
                    <div id="layoutPopover" class="layout-popover" hidden>
                      <div class="layout-option-group">
                        <div class="layout-option-title" data-i18n="iframe_layoutDisplayTitle">呈现形式</div>
                        <div class="layout-option-row">
                          <button class="layout-option-btn" type="button" data-layout-rows="1" data-i18n="iframe_layoutRows1">1排</button>
                          <button class="layout-option-btn" type="button" data-layout-rows="2" data-i18n="iframe_layoutRows2">2排</button>
                          <button class="layout-option-btn" type="button" data-layout-rows="3" data-i18n="iframe_layoutRows3">3排</button>
                          <button class="layout-option-btn" type="button" data-layout-mode="sidebar" data-i18n="iframe_layoutFullscreen">全屏</button>
                        </div>
                      </div>
                      <div id="cardSizeGroup" class="layout-option-group">
                        <div class="layout-option-title" data-i18n="iframe_layoutWidthTitle">宽度</div>
                        <div class="card-size-slider-wrap">
                          <input id="cardSizeSlider" type="range" min="1" max="5" step="1" value="3" class="card-size-slider">
                          <div class="card-size-slider-labels">
                            <span data-i18n="iframe_layoutNarrow">窄</span>
                            <span data-i18n="iframe_layoutWide">宽</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="composer-inline-actions">
                <button id="newChatBtn" class="composer-inline-icon composer-tooltip-btn" type="button" data-tooltip="新建对话" data-i18n-attr="aria-label:iframe_newChat;data-tooltip:iframe_newChat">
                  <svg viewBox="0 0 1024 1024" fill="currentColor" stroke="none" aria-hidden="true">
                    <path d="M512 101.5c-247.4 0-448 173.6-448 387.7 0 108.5 51.5 206.5 134.4 276.9v156.4l165.4-67.3c46.4 14.1 96.3 21.7 148.2 21.7 247.4 0 448-173.6 448-387.7S759.4 101.5 512 101.5z m0 708.4c-44.2 0-87.6-6.3-128.8-18.8l-22.7-6.9-22 9-73.1 29.8v-87.8L241.7 715c-35.1-29.8-62.6-64.4-81.6-102.8-19.3-39-29.1-80.4-29.1-123 0-176.8 170.9-320.7 381-320.7s381 143.9 381 320.7-170.9 320.7-381 320.7z"/>

                  </svg>
                </button>

                <div class="composer-prompt-wrap">
                  <button id="promptAssistBtn" class="composer-inline-icon composer-tooltip-btn" type="button" data-tooltip="预设提示词" data-i18n-attr="aria-label:iframe_promptAssist;data-tooltip:iframe_promptAssist" aria-expanded="false">
                    <svg viewBox="-150 -150 1500 1500" aria-hidden="true">
                      <path d="M188.6,782.5c1.2-6.5,6.2-11.6,12.6-13c0.1,0,0.1,0,0.2-0.1c9.2-2.3,18.5,3.3,20.8,12.5l7.8,30.7 c15.9,60,63.3,106.4,123.6,121l31.2,7.6c6.1,1.6,10.9,6.3,12.7,12.4c1.1,4.4,0.4,9.1-2,13c-2.4,3.9-6.3,6.7-10.7,7.7l-31.2,7.7 c-60.6,14.5-108.2,61.3-123.6,121.6l-7.8,30.7c-1.9,6-6.6,10.6-12.6,12.4c-0.1,0-0.1,0-0.2,0.1c-9.2,2.3-18.5-3.3-20.8-12.5 l-7.8-30.7c-15.6-60.2-63.1-107-123.6-121.6L26,974.4c-6.2-1.5-11-6.3-12.6-12.4c-2.2-9.2,3.4-18.4,12.6-20.7l31.2-7.6 c60.2-14.9,107.4-61.7,123-121.7l7.8-30.7L188.6,782.5z M868.5,13c1.7-6.1,6.5-10.9,12.6-12.4c0.1,0,0.1,0,0.2,0 c9.2-2.3,18.5,3.2,20.8,12.4l7.8,30.8c15.8,60,63.3,106.6,123.6,121.1l31.2,7.7c6.1,1.6,10.9,6.3,12.6,12.4c1.1,4.4,0.4,9-1.9,12.9 c-2.4,3.9-6.2,6.7-10.7,7.8l-31.2,8.1c-60.5,14.6-108,61.4-123.6,121.6l-7.8,30.7c-1.9,6-6.6,10.6-12.6,12.4c-0.1,0-0.1,0-0.2,0.1 c-9.2,2.3-18.5-3.3-20.8-12.5l-7.8-30.7c-15.8-59.9-63.1-106.4-123.3-121.1l-31.2-7.5c-6.1-1.6-10.9-6.3-12.6-12.4c0,0,0,0,0,0 c-2.2-9.2,3.4-18.5,12.6-20.7l31.2-7.7c60.1-15,107.2-61.6,122.7-121.6l7.8-30.7L868.5,13z M131,26.5h-4.2 c-6.1,1.6-10.9,6.3-12.6,12.4l-1.8,5.8c-11.8,45.1-47.4,79.9-92.7,90.7l-6.6,1.8c-9.1,2.2-14.8,11.4-12.6,20.6 c1.6,6.2,6.4,10.9,12.6,12.4l6,1.8c45.3,10.9,80.9,45.9,92.4,91l1.8,6.4c1.9,7.8,9.1,13.3,17.1,13h4.2c6.2-1.5,11-6.3,12.6-12.4 l1.8-5.8c11.5-45.1,47.1-80.2,92.4-91l6.6-1.8c8.9-2.2,14.4-11.1,12.6-20.1c-1.6-6.2-6.4-10.9-12.6-12.4l-6-1.8 c-45.3-10.9-80.8-46-92.3-91.1l-1.8-6.4c-1.9-7.8-9.1-13.3-17.1-13L131,26.5z M1174.6,911.2c16.3,16,25.6,37.9,25.7,60.8v185.1 c-0.5,23.8-20,42.9-43.8,42.9H968.9c-23.3,0.2-45.7-9.1-62-25.7L336.3,613c-54-52.7-70.3-133.1-41-202.7 c29.8-69.9,98.7-115,174.7-114.5v-1.1c50,0,98,19.4,133.9,54.3L1174.6,911.2z M399.8,411.6c-0.3,0.3-0.6,0.6-1,1 c-37.5,38-37,99.2,1,136.6l106.6,105.3l140.2-138L540.3,411.4C501.1,373.7,439,373.7,399.8,411.6L399.8,411.6z M968.9,1110.3h141.4 V973.2L710.5,579.3L570.3,717.4L968.9,1110.3z"></path>
                    </svg>
                  </button>
                  <div id="promptPicker" class="composer-prompt-picker" hidden></div>
                </div>

                <button id="fileUploadBtn" class="composer-inline-icon composer-tooltip-btn" type="button" data-tooltip="附加文件" data-i18n-attr="aria-label:iframe_uploadFile;data-tooltip:iframe_uploadFileTooltip">
                  <svg viewBox="127.4 128 768 768" aria-hidden="true">
                    <path d="M417 896a279.4 279.4 0 0 1-197.6-477l233.3-233.3a196.9 196.9 0 0 1 278.5 278.5L498 697.5a114.5 114.5 0 0 1-161.9-161.9l233.2-233.3a32 32 0 1 1 45.3 45.3L381.3 580.9a50 50 0 0 0 71.4 71.4L686 419a133 133 0 0 0-188-188.1L264.7 464.2a215.4 215.4 0 1 0 304.6 304.7l262.5-262.4a32 32 0 0 1 45.2 45.2L614.6 814.2A277.8 277.8 0 0 1 417 896z" fill="currentColor"></path>
                  </svg>
                </button>
                <input type="file" id="fileUploadInput" multiple accept="image/*,.pdf,.txt,.md,.doc,.docx,.csv,.json,.xml" hidden>

                <button id="sendSelectedBtn" class="composer-inline-icon composer-inline-icon-send is-empty" type="button" data-i18n-attr="aria-label:iframe_send">
                  <svg viewBox="0 0 1024 1024" aria-hidden="true">
                    <path d="M554.666667 268.8v601.6h-85.333334V268.8L337.066667 401.066667 277.333333 341.333333 512 106.666667 746.666667 341.333333l-59.733334 59.733334L554.666667 268.8z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        </div>
        <button id="settingsBtn" class="bottom-settings-entry composer-tooltip-btn" type="button" data-tooltip="打开设置" data-i18n-attr="aria-label:iframe_openSettings;data-tooltip:iframe_openSettings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </section>
